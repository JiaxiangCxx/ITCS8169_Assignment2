experiment:
  name: joint_simclr_w0.5
  seed: 0
data:
  root: dataset
  train_dir: train
  test_dir: test
  split_file: splits/seed0_val20.json
  val_fraction: 0.2
  image_size: 224
  cache_size: 256
  augmentation: basic
  batch_size: 128
  num_workers: 6
  ssl_augmentation:
    crop_min: 0.2
    color_jitter: 0.4
    jitter_p: 0.8
    grayscale_p: 0.2
    blur_p: 0.5
model:
  name: resnet18
  init: scratch
  projector:
    hidden_dim: 2048
    out_dim: 128
    num_layers: 2
joint:
  weight: 0.5
  temperature: 0.2
train:
  epochs: 200
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.05
  warmup_epochs: 5
  label_smoothing: 0.1
  amp: true
  early_stopping_patience: 0
