experiment:
  name: sup_strong_seed1
  seed: 1
data:
  root: dataset
  train_dir: train
  test_dir: test
  split_file: splits/seed0_val20.json
  val_fraction: 0.2
  image_size: 224
  cache_size: 256
  augmentation: strong
  batch_size: 128
  num_workers: 6
  split_seed: 0
model:
  name: resnet18
  init: scratch
train:
  epochs: 200
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.05
  warmup_epochs: 5
  label_smoothing: 0.1
  amp: true
  early_stopping_patience: 0
